scope: aggregate_community_flow
node_features: original_nine_supply_evaluations
capacity_correction: false
pressure_capacity: off
travel_time: topo_only
tier_flow_allocation: false
candidate_destinations: all_original_communities
input: tiered_supply_attributes_only
attention: dynamic
context: directed
int_channel_order: [nested, independent, none]
dim: 16
lr: 0.02
max_epochs: 400
patience: 20
l2: 0.0001
seeds: [0, 1, 2, 3, 4]
cv:
  folds: 5
  blocks: 25
  buffer: adjacent
  assignments: 2000
baseline: destination_supply_linear_plus_topology
synthetic:
  scenarios: [S0, S1, S1s, S2, S3]
  strengths: [0.1, 0.3, 0.5]
  replications: 5
  null_repeats: 20
  comp_edge_auc: 0.85
  comp_node_auc: 0.85
  comp_topology_correlation: 0.7
  compet_edge_auc: 0.75
  compet_node_auc: 0.70
  pressure_detection_min: 4
  false_positive_max: 1
  necessary_gate_first: S2_strength_0.3_five_replications
